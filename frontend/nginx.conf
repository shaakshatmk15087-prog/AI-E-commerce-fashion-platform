# Serves the built React app and proxies /api to the Flask backend.
# TLS is expected to be terminated in front of this container (cloud load balancer, Caddy, Cloudflare, ...);
# it should send X-Forwarded-Proto. If a load balancer sits in front, also configure `set_real_ip_from`/`real_ip_header`
# so that $remote_addr is the real client (rate limits and audit logs use it).

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;

map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No server-level add_header: nginx would stack them on top of the API's own (stricter) headers.
    # Static responses set theirs per location below (a location-level add_header replaces inherited ones).

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 70s;
    }

    # Credential endpoints get a much tighter ceiling on top of the application's own limits.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Hashed build assets can be cached forever; index.html must always be revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
